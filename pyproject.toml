[project]
name = "sift-guard"
version = "0.1.0"
description = "Autonomous DFIR agent with cross-validation. SANS Find Evil! 2026."
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # pytsk3 (libtsk bindings) — disk_mft_timeline walks the MFT
    # directly via libtsk since 2026-05-19, replacing the much
    # slower plaso log2timeline pipeline (~240× faster on a 28 GB
    # disk). The wheel builds against libtsk-dev which is present
    # on SIFT 2026.1 by default.
    "pytsk3",
]
license = { text = "MIT" }

[project.scripts]
sift-guard = "sift_guard.cli:main"

[tool.setuptools]
# Explicit package list — the repo has multiple top-level packages
# (orchestrator, server, etc.), which trips setuptools' auto-discovery
# heuristic. Listing them keeps `pip install -e .` deterministic and
# registers the `sift-guard` console script.
packages = [
    "orchestrator",
    "rag",
    "reporting",
    "server",
    "server.runners",
    "server.tools",
    "sift_guard",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
# Forensic RAG corpus + retrieval. Pulled by `pip install -e .[rag]`.
# Kept out of the core install because torch/transformers add ~2 GB
# (CUDA wheels are transitive deps of sentence-transformers); the MCP
# server runs without them. Versions pinned so a fresh checkout
# reproduces the same embeddings byte-for-byte. See rag/README.md.
rag = [
    "sentence-transformers==5.4.1",
    "faiss-cpu==1.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "integration: tests that need a live SIFT VM over SSH (skipped by default; run with `pytest -m integration`)",
]
addopts = ["-m", "not integration"]
